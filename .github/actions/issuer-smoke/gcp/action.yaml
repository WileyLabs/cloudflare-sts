name: issuer-smoke gcp
description: GCP WIF ID token verifies at cf-sts

inputs:
  cf_sts_url:
    default: https://cf-sts.example.com
  audience:
    default: cf-sts.example.com
  gcp_workload_identity_provider:
    default: projects/000000000000/locations/global/workloadIdentityPools/github/providers/github-actions
  gcp_service_account:
    default: sa-ci@example-project.iam.gserviceaccount.com
  spire_socket:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Authenticate (WIF → ID token)
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}
        token_format: id_token
        id_token_audience: ${{ inputs.audience }}
        id_token_include_email: true

    - name: Exchange at cf-sts
      shell: bash
      env:
        JWT: ${{ steps.auth.outputs.id_token }}
        CF_STS_URL: ${{ inputs.cf_sts_url }}
        ACCEPT_UNKNOWN_ISSUER: '1'
      run: |
        chmod +x "${{ github.workspace }}/scripts/ci/"*.sh
        echo "$JWT" | cut -d. -f2 | bash "${{ github.workspace }}/scripts/ci/b64url-decode.sh" | jq '{iss, sub, email, email_verified, aud}'
        bash "${{ github.workspace }}/scripts/ci/assert-cf-sts-exchange.sh"
