# Example only. Run beside the SPIRE server; expose publicly over TLS at oidc-discovery.example.com.
log_level = "INFO"

domains = ["oidc-discovery.example.com"]

acme {
  cache_dir = "/run/spire/oidc-acme-cache"
  email     = "admin@example.com"
  tos_accepted = true
}

server_api {
  address = "unix:///run/spire/sockets/server.sock"
}
